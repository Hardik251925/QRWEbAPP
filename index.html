<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>AR Heart Viewer</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,system-ui,sans-serif;background:#0a0a10;color:#eee;
            min-height:100dvh;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
        .page{max-width:520px;margin:0 auto;padding:16px 16px 40px}
        h1{font-size:22px;text-align:center;margin:28px 0 4px}
        .sub{font-size:13px;color:#777;text-align:center;margin-bottom:16px;line-height:1.6}
        .viewer-box{border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,0.08);
            background:#12121a;margin-bottom:12px;position:relative}
        model-viewer{width:100%;height:55dvh;min-height:320px;
            --poster-color:transparent;--progress-bar-color:#00e6a0;--progress-bar-height:3px}
        .mv-ar-btn{display:flex;align-items:center;justify-content:center;gap:8px;
            position:absolute;bottom:14px;left:14px;right:14px;padding:15px;
            background:linear-gradient(135deg,#00e6a0,#00c488);border:none;border-radius:14px;
            color:#fff;font-size:16px;font-weight:600;cursor:pointer;z-index:10;
            -webkit-appearance:none;box-shadow:0 4px 20px rgba(0,230,160,0.3)}
        .mv-ar-btn:active{opacity:0.85;transform:scale(0.97)}
        .ios-direct{display:block;text-align:center;padding:15px;
            background:linear-gradient(135deg,#6c5ce7,#a855f7);border-radius:14px;
            color:#fff;font-size:16px;font-weight:600;text-decoration:none;margin-bottom:12px}
        .ios-direct:active{opacity:0.85}
        .status-box{padding:12px 16px;border-radius:12px;background:#12121a;
            border:1px solid rgba(255,255,255,0.06);font-size:13px;color:#888;
            margin-bottom:10px;line-height:1.7}
        .status-box b{color:#00e6a0}
        .status-box.err{border-color:rgba(255,80,80,0.3)}
        .status-box.err b{color:#ff6b6b}
        .check-item{display:flex;align-items:flex-start;gap:8px;padding:6px 0;font-size:13px}
        .check-icon{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
            font-size:11px;flex-shrink:0;margin-top:1px}
        .check-ok{background:rgba(0,230,160,0.15);color:#00e6a0}
        .check-fail{background:rgba(255,80,80,0.15);color:#ff6b6b}
        .check-wait{background:rgba(255,200,0,0.15);color:#ffc800}
        .fix-card{padding:14px;background:#1a1a26;border:1px solid rgba(255,255,255,0.08);
            border-radius:12px;margin-top:12px;font-size:12px;color:#888;line-height:1.7}
        .fix-card h3{font-size:14px;color:#fff;margin-bottom:8px;font-weight:600}
        .fix-card code{background:#222;padding:2px 6px;border-radius:4px;color:#00e6a0;font-size:11px}
    </style>
</head>
<body>
<div class="page">
    <h1>❤️ AR Heart Viewer</h1>
    <p class="sub">iPhone Safari mein kholo. Green ya Purple button dabao.</p>
    <div class="status-box" id="status">⏳ Checking model files...</div>

    <div class="viewer-box">
        <model-viewer id="viewer" alt="Heart 3D Model" ar
            ar-modes="scene-viewer quick-look" ar-scale="auto" ar-placement="floor"
            camera-controls touch-action="pan-y" auto-rotate shadow-intensity="1" exposure="1">
            <button slot="ar-button" class="mv-ar-btn">📱 View in AR</button>
        </model-viewer>
    </div>

    <!-- iOS Direct Quick Look — MOST RELIABLE -->
    <a class="ios-direct" id="ios-link" rel="ar" href="assets/model/heart.usdz" style="display:none">
        <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" style="width:1px;height:1px;position:absolute;opacity:0">
        🍎 iPhone AR — Direct Quick Look
    </a>

    <div id="checks"></div>
    <div class="fix-card" id="fix-guide" style="display:none"><h3>🔧 Fix Guide</h3><div id="fix-content"></div></div>
</div>

<script>
const viewer = document.getElementById('viewer');
const statusEl = document.getElementById('status');
const checksDiv = document.getElementById('checks');
const fixGuide = document.getElementById('fix-guide');
const fixContent = document.getElementById('fix-content');
const iosLink = document.getElementById('ios-link');
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

const LOCAL_GLB  = 'assets/model/heart.glb';
const LOCAL_USDZ = 'assets/model/heart.usdz';
const FALLBACK_GLB  = 'https://modelviewer.dev/shared-assets/models/Astronaut.glb';
const FALLBACK_USDZ = 'https://modelviewer.dev/shared-assets/models/Astronaut.usdz';

const checks = [];
function addCheck(icon, text) {
    const cls = icon === '✓' ? 'check-ok' : icon === '✗' ? 'check-fail' : 'check-wait';
    checks.push(`<div class="check-item"><div class="check-icon ${cls}">${icon}</div><div>${text}</div></div>`);
    checksDiv.innerHTML = checks.join('');
}

addCheck(location.protocol === 'https:' ? '✓' : '✗',
    'HTTPS: ' + (location.protocol === 'https:' ? 'Active ✓' : 'MISSING — AR will NOT work!'));
addCheck('✓', `Platform: ${isIOS ? 'iOS' : 'Android/Desktop'}`);
if (isIOS) { iosLink.style.display = 'block'; addCheck('✓', 'iOS fallback button: shown (purple)'); }

async function testFile(url, label) {
    try {
        const r = await fetch(url, { method: 'HEAD' });
        const ok = r.ok;
        addCheck(ok ? '✓' : '✗', `${label}: ${ok ? 'FOUND' : 'NOT FOUND ('+r.status+')'} — ${url}`);
        return ok;
    } catch (e) {
        addCheck('✗', `${label}: ERROR — ${e.message}`);
        return false;
    }
}

async function init() {
    const glbOk  = await testFile(LOCAL_GLB, 'GLB file');
    const usdzOk = await testFile(LOCAL_USDZ, 'USDZ file');

    if (glbOk) {
        viewer.src = LOCAL_GLB;
        if (usdzOk) { viewer.setAttribute('ios-src', LOCAL_USDZ); iosLink.href = LOCAL_USDZ; }
        statusEl.innerHTML = '<b>✓ Heart model loaded!</b> AR button dabao.';
    } else {
        viewer.src = FALLBACK_GLB;
        viewer.setAttribute('ios-src', FALLBACK_USDZ);
        iosLink.href = FALLBACK_USDZ;
        statusEl.className = 'status-box err';
        statusEl.innerHTML = '<b>✗ heart.glb nahi mila!</b> Astronaut fallback loaded. Fix guide neeche dekho.';
        addCheck('⚠', 'FALLBACK model (Astronaut) use ho raha hai');
        fixGuide.style.display = 'block';
        fixContent.innerHTML = `
            <p><b>Problem:</b> <code>${LOCAL_GLB}</code> GitHub pe nahi mili.</p>
            <p style="margin-top:8px"><b>Ye check karo:</b></p>
            <p style="margin:8px 0;padding:10px;background:#111;border-radius:8px;font-family:monospace;font-size:12px;line-height:2">
                QRWEbAPP/<br>
                ├── index.html<br>
                └── assets/<br>
                &nbsp;&nbsp;&nbsp;&nbsp;└── model/<br>
                &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;├── heart.glb<br>
                &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;└── heart.usdz
            </p>
            <p style="margin-top:8px">Browser mein ye URL kholo:</p>
            <p><code>https://hardik251925.github.io/QRWEbAPP/assets/model/heart.glb</code></p>
            <p style="margin-top:4px">Agar 404 aaye = file waha nahi hai.</p>
            <p style="margin-top:10px;color:#ff6b6b"><b>⚠️ CASE SENSITIVE!</b><br>
            <code>Assets/Model/Heart.glb</code> ≠ <code>assets/model/heart.glb</code><br>
            GitHub pe exact folder names check karo — capital/small letter matter karta hai!</p>
            <p style="margin-top:10px"><b>Quick fix:</b> GitHub repo kholo → files pe click karo → path exactly copy karo aur iss file mein <code>LOCAL_GLB</code> variable mein paste karo.</p>
        `;
    }
}

viewer.addEventListener('load', () => addCheck('✓', '3D model rendered OK'));
viewer.addEventListener('error', () => addCheck('✗', 'model-viewer render FAILED'));
viewer.addEventListener('ar-status', (e) => {
    if (e.detail.status === 'failed') addCheck('✗', 'AR FAILED — purple button try karo');
    if (e.detail.status === 'session-started') addCheck('✓', 'AR session started!');
});

init();
</script>
</body>
</html>
