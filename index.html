<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0a10">
    <title>AR Medical Viewer</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#0a0a10;--s1:#12121a;--s2:#1a1a26;--s3:#222233;
            --b:rgba(255,255,255,0.06);--b2:rgba(255,255,255,0.12);
            --t:#eeeae4;--t2:#9a968e;--t3:#5a5750;
            --ac:#00e6a0;--ac2:#6c5ce7;--ac3:#ff6b6b;--acg:rgba(0,230,160,0.12);
            --r:12px;
        }
        body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--t);
            min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}

        /* ═══ SCREENS ═══ */
        .screen{display:none;min-height:100dvh}
        .screen.active{display:flex;flex-direction:column}

        /* ═══ START PAGE ═══ */
        #start-screen{align-items:center;justify-content:center;padding:24px;text-align:center;
            background:radial-gradient(ellipse at 50% 80%,#141428 0%,var(--bg) 70%)}
        .start-logo{width:80px;height:80px;border-radius:24px;
            background:linear-gradient(135deg,var(--ac),var(--ac2));
            display:grid;place-items:center;margin:0 auto 20px;
            box-shadow:0 8px 40px rgba(0,230,160,0.2);font-size:36px;font-weight:700;color:#fff}
        .start-title{font-size:28px;font-weight:700;letter-spacing:-0.5px;margin-bottom:6px}
        .start-sub{font-size:14px;color:var(--t2);margin-bottom:32px;line-height:1.6;max-width:340px}
        .start-buttons{display:flex;gap:12px;width:100%;max-width:400px}
        .start-btn{flex:1;padding:18px 12px;border-radius:16px;border:1px solid var(--b2);
            background:var(--s1);cursor:pointer;text-align:center;
            transition:transform 0.15s,border-color 0.2s,background 0.2s}
        .start-btn:active{transform:scale(0.96)}
        .start-btn:hover{border-color:var(--ac);background:var(--s2)}
        .start-btn .icon{font-size:28px;margin-bottom:8px;display:block}
        .start-btn .label{font-size:13px;font-weight:600;color:var(--t)}
        .start-btn .desc{font-size:11px;color:var(--t3);margin-top:3px}
        .start-btn.primary{border-color:var(--ac);background:rgba(0,230,160,0.06)}
        .start-btn.primary .label{color:var(--ac)}

        /* ═══ APP SHELL ═══ */
        #app-screen{padding-bottom:70px}
        .top-bar{display:flex;align-items:center;gap:10px;padding:14px 16px;
            border-bottom:1px solid var(--b);background:rgba(10,10,16,0.9);
            backdrop-filter:blur(12px);position:sticky;top:0;z-index:50}
        .back-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--b2);
            background:var(--s1);display:grid;place-items:center;cursor:pointer;
            color:var(--t2);font-size:16px}
        .top-title{font-size:15px;font-weight:600;flex:1}
        .mode-pill{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;
            text-transform:uppercase;letter-spacing:0.5px}
        .mode-pill.ar{background:rgba(0,230,160,0.12);color:var(--ac)}
        .mode-pill.video{background:rgba(108,92,231,0.15);color:var(--ac2)}
        .mode-pill.info{background:rgba(255,107,107,0.12);color:var(--ac3)}

        /* ═══ MODEL LIST (horizontal scroll) ═══ */
        .model-strip{display:flex;gap:10px;padding:14px 16px;overflow-x:auto;
            scrollbar-width:none;border-bottom:1px solid var(--b)}
        .model-strip::-webkit-scrollbar{display:none}
        .model-chip{flex-shrink:0;display:flex;align-items:center;gap:8px;
            padding:8px 14px 8px 8px;border-radius:12px;border:1px solid var(--b);
            background:var(--s1);cursor:pointer;transition:border-color 0.2s,background 0.2s}
        .model-chip.active{border-color:var(--ac);background:rgba(0,230,160,0.06)}
        .model-chip .thumb{width:36px;height:36px;border-radius:8px;background:var(--s2);
            display:grid;place-items:center;font-size:18px}
        .model-chip .chip-name{font-size:12px;font-weight:600}
        .model-chip .chip-cat{font-size:10px;color:var(--t3)}

        /* ═══ 3D VIEWER ═══ */
        .viewer-wrap{position:relative;background:var(--s1);border-bottom:1px solid var(--b)}
        model-viewer{width:100%;height:52dvh;min-height:340px;
            --poster-color:transparent;--progress-bar-color:var(--ac);--progress-bar-height:3px}
        .ar-btn-slot{display:flex;align-items:center;justify-content:center;gap:8px;
            position:absolute;bottom:16px;left:16px;right:16px;padding:14px;
            background:linear-gradient(135deg,var(--ac),#00c488);border:none;border-radius:14px;
            color:#fff;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;
            box-shadow:0 4px 24px rgba(0,230,160,0.3);z-index:10}
        .ar-btn-slot:active{transform:scale(0.97)}

        /* ═══ HOTSPOTS ═══ */
        .hotspot{width:28px;height:28px;border-radius:50%;border:2px solid var(--ac);
            background:rgba(0,230,160,0.2);cursor:pointer;display:flex;align-items:center;
            justify-content:center;transition:transform 0.2s,background 0.2s;
            backdrop-filter:blur(4px);position:relative}
        .hotspot:hover,.hotspot.active{transform:scale(1.3);background:rgba(0,230,160,0.5)}
        .hotspot::after{content:attr(data-label);position:absolute;bottom:calc(100% + 6px);
            left:50%;transform:translateX(-50%);white-space:nowrap;padding:4px 10px;
            border-radius:8px;background:var(--s2);border:1px solid var(--b2);
            font-size:11px;font-weight:500;color:var(--t);opacity:0;pointer-events:none;
            transition:opacity 0.2s}
        .hotspot.active::after{opacity:1}
        .hotspot .dot{width:8px;height:8px;border-radius:50%;background:var(--ac);
            animation:pulse-dot 2s ease-in-out infinite}
        @keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.7)}}

        /* ═══ INFO POPUP (on hotspot click) ═══ */
        .info-popup{position:absolute;bottom:80px;left:16px;right:16px;
            background:var(--s2);border:1px solid var(--b2);border-radius:16px;
            padding:16px;z-index:20;display:none;animation:slideUp 0.25s ease}
        .info-popup.show{display:block}
        @keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .info-popup .popup-title{font-size:14px;font-weight:600;margin-bottom:4px}
        .info-popup .popup-text{font-size:13px;color:var(--t2);line-height:1.6}
        .info-popup .close-popup{position:absolute;top:10px;right:12px;width:24px;height:24px;
            border-radius:50%;background:var(--s3);border:none;color:var(--t2);cursor:pointer;
            display:grid;place-items:center;font-size:14px}

        /* ═══ INFO PANEL (below viewer) ═══ */
        .info-panel{padding:16px}
        .info-card{background:var(--s1);border:1px solid var(--b);border-radius:var(--r);
            padding:16px;margin-bottom:10px}
        .info-card h3{font-size:15px;font-weight:600;margin-bottom:6px}
        .info-card p{font-size:13px;color:var(--t2);line-height:1.7}
        .info-card .tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
        .info-tag{padding:4px 10px;border-radius:8px;font-size:11px;font-weight:500;
            background:var(--s2);border:1px solid var(--b);color:var(--t2)}

        /* ═══ VIDEO SECTION ═══ */
        .video-section{padding:16px}
        .video-placeholder{width:100%;aspect-ratio:16/9;border-radius:var(--r);
            background:var(--s1);border:1px solid var(--b);display:flex;flex-direction:column;
            align-items:center;justify-content:center;gap:8px;margin-bottom:12px}
        .video-placeholder .play-icon{width:56px;height:56px;border-radius:50%;
            background:rgba(108,92,231,0.2);border:2px solid var(--ac2);
            display:grid;place-items:center;font-size:22px;color:var(--ac2)}
        .video-placeholder p{font-size:13px;color:var(--t3)}
        .video-list{display:flex;flex-direction:column;gap:8px}
        .video-item{display:flex;align-items:center;gap:12px;padding:12px;
            background:var(--s1);border:1px solid var(--b);border-radius:var(--r);cursor:pointer}
        .video-item:hover{border-color:var(--ac2)}
        .video-item .vi-thumb{width:44px;height:44px;border-radius:8px;background:var(--s2);
            display:grid;place-items:center;font-size:20px;flex-shrink:0}
        .video-item .vi-info{flex:1}
        .video-item .vi-title{font-size:13px;font-weight:500}
        .video-item .vi-dur{font-size:11px;color:var(--t3)}

        /* ═══ BOTTOM NAV ═══ */
        .bottom-nav{position:fixed;bottom:0;left:0;right:0;
            display:flex;background:rgba(10,10,16,0.95);backdrop-filter:blur(16px);
            border-top:1px solid var(--b);z-index:100;padding:6px 0 env(safe-area-inset-bottom,6px)}
        .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;
            gap:3px;padding:8px 0;cursor:pointer;transition:color 0.2s;color:var(--t3)}
        .nav-item.active{color:var(--ac)}
        .nav-item .nav-icon{font-size:20px}
        .nav-item .nav-label{font-size:10px;font-weight:600;letter-spacing:0.3px}

        /* ═══ UTILS ═══ */
        .hidden{display:none!important}
        .section{display:none}.section.active{display:block}
    </style>
</head>
<body>

<!-- ════════════════════ START SCREEN ════════════════════ -->
<div class="screen active" id="start-screen">
    <div class="start-logo">AR</div>
    <h1 class="start-title">AR Medical Viewer</h1>
    <p class="start-sub">
        3D models explore karo AR mein. Hotspots pe click karke detailed information paao. 
        Android + iOS dono pe kaam karta hai.
    </p>
    <div class="start-buttons">
        <div class="start-btn primary" onclick="launchApp('ar')">
            <span class="icon">📱</span>
            <span class="label">AR View</span>
            <span class="desc">Place in real world</span>
        </div>
        <div class="start-btn" onclick="launchApp('video')">
            <span class="icon">🎬</span>
            <span class="label">Video</span>
            <span class="desc">Watch tutorials</span>
        </div>
        <div class="start-btn" onclick="launchApp('info')">
            <span class="icon">📋</span>
            <span class="label">Information</span>
            <span class="desc">Read details</span>
        </div>
    </div>
</div>

<!-- ════════════════════ APP SCREEN ════════════════════ -->
<div class="screen" id="app-screen">
    
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="back-btn" onclick="goHome()">←</div>
        <span class="top-title" id="top-title">AR View</span>
        <span class="mode-pill ar" id="mode-pill">AR</span>
    </div>

    <!-- Model Strip (dynamic list) -->
    <div class="model-strip" id="model-strip"></div>

    <!-- ─── AR SECTION ─── -->
    <div class="section active" id="section-ar">
        <div class="viewer-wrap">
            <model-viewer
                id="viewer"
                src="assets/model/heart.glb"
                ios-src="assets/model/heart.usdz"
                alt="3D Model"
                ar
                ar-modes="scene-viewer quick-look"
                ar-scale="auto"
                ar-placement="floor"
                camera-controls
                touch-action="pan-y"
                auto-rotate
                rotation-per-second="16deg"
                shadow-intensity="1.5"
                shadow-softness="0.8"
                exposure="1.1"
                environment-image="neutral"
                interaction-prompt="auto"
                camera-orbit="30deg 75deg 2.5m"
                interpolation-decay="100"
            >
                <!-- AR Button -->
                <button slot="ar-button" class="ar-btn-slot">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.18L19.18 7.5 12 10.82 4.82 7.5 12 4.18zM4 9.32l7 3.5V19.3l-7-3.5V9.32zm9 10v-6.48l7-3.5v6.48l-7 3.5z"/></svg>
                    View in AR — Plane Detection
                </button>

                <!-- Hotspots (dynamically managed by JS) -->
                <div id="hotspot-container"></div>
            </model-viewer>

            <!-- Info Popup (appears on hotspot click) -->
            <div class="info-popup" id="info-popup">
                <button class="close-popup" onclick="closePopup()">✕</button>
                <div class="popup-title" id="popup-title"></div>
                <div class="popup-text" id="popup-text"></div>
            </div>
        </div>

        <!-- Model Info below viewer -->
        <div class="info-panel" id="ar-info-panel"></div>
    </div>

    <!-- ─── VIDEO SECTION ─── -->
    <div class="section" id="section-video">
        <div class="video-section" id="video-section-content"></div>
    </div>

    <!-- ─── INFO SECTION ─── -->
    <div class="section" id="section-info">
        <div class="info-panel" id="info-section-content"></div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <div class="nav-item active" id="nav-ar" onclick="switchSection('ar')">
            <span class="nav-icon">📱</span>
            <span class="nav-label">AR</span>
        </div>
        <div class="nav-item" id="nav-video" onclick="switchSection('video')">
            <span class="nav-icon">🎬</span>
            <span class="nav-label">Video</span>
        </div>
        <div class="nav-item" id="nav-info" onclick="switchSection('info')">
            <span class="nav-icon">📋</span>
            <span class="nav-label">Info</span>
        </div>
    </div>
</div>

<script>
// ══════════════════════════════════════════════
// MODEL DATA — Apne models yahan add/edit karo
// ══════════════════════════════════════════════
const MODELS = [
    {
        id: 'heart',
        name: 'Human Heart',
        category: 'Cardiology',
        emoji: '❤️',
        glb: 'assets/model/heart.glb',
        usdz: 'assets/model/heart.usdz',
        cameraOrbit: '30deg 75deg 2.5m',
        description: 'A detailed 3D model of the human heart showing all four chambers, major arteries, and veins. Perfect for medical education and patient consultation.',
        tags: ['Anatomy', 'Cardiology', 'Education'],
        hotspots: [
            {
                position: '0.0 0.08 0.04',
                normal: '0 1 0',
                label: 'Left Ventricle',
                info: 'The left ventricle is the thickest chamber of the heart. It pumps oxygenated blood to the entire body through the aorta. Wall thickness: 1.3-1.5 cm.'
            },
            {
                position: '0.03 0.1 -0.02',
                normal: '0.5 0.5 0.5',
                label: 'Right Atrium',
                info: 'The right atrium receives deoxygenated blood from the body through the superior and inferior vena cava. It then passes blood to the right ventricle.'
            },
            {
                position: '-0.02 0.14 0.01',
                normal: '0 1 0',
                label: 'Aorta',
                info: 'The aorta is the largest artery in the body. It carries oxygenated blood from the left ventricle to the rest of the body. Diameter: ~2.5 cm.'
            },
            {
                position: '0.02 0.13 0.03',
                normal: '0 0.5 0.5',
                label: 'Pulmonary Artery',
                info: 'The pulmonary artery carries deoxygenated blood from the right ventricle to the lungs for oxygenation. It is the only artery that carries deoxygenated blood.'
            }
        ],
        videos: [
            { title: 'How the Heart Pumps Blood', duration: '3:45', emoji: '🫀' },
            { title: 'Heart Anatomy Overview', duration: '5:20', emoji: '📖' },
            { title: 'Common Heart Conditions', duration: '7:10', emoji: '⚕️' }
        ],
        infoSections: [
            { title: 'Overview', text: 'The human heart is a muscular organ about the size of a fist. It beats approximately 100,000 times per day, pumping about 7,570 liters of blood.' },
            { title: 'Chambers', text: 'The heart has 4 chambers: Right Atrium, Right Ventricle, Left Atrium, and Left Ventricle. The left side pumps oxygenated blood, the right side pumps deoxygenated blood.' },
            { title: 'Blood Flow', text: 'Blood flow path: Body → Vena Cava → Right Atrium → Right Ventricle → Pulmonary Artery → Lungs → Pulmonary Veins → Left Atrium → Left Ventricle → Aorta → Body' }
        ]
    },
    {
        id: 'brain',
        name: 'Human Brain',
        category: 'Neurology',
        emoji: '🧠',
        glb: 'https://modelviewer.dev/shared-assets/models/Astronaut.glb',
        usdz: null,
        cameraOrbit: '45deg 65deg 2.5m',
        description: 'Explore the human brain with interactive annotations showing major regions and their functions.',
        tags: ['Anatomy', 'Neurology', 'Education'],
        hotspots: [
            { position: '0 0.12 0.05', normal: '0 1 0', label: 'Frontal Lobe', info: 'The frontal lobe controls personality, decision-making, planning, and voluntary movement. It is the largest lobe of the brain.' },
            { position: '0.05 0.1 -0.03', normal: '1 0 0', label: 'Temporal Lobe', info: 'The temporal lobe processes auditory information, memory, and speech comprehension (Wernicke\'s area).' }
        ],
        videos: [
            { title: 'Brain Structure Explained', duration: '6:30', emoji: '🧠' },
            { title: 'How Neurons Communicate', duration: '4:15', emoji: '⚡' }
        ],
        infoSections: [
            { title: 'Overview', text: 'The brain weighs about 1.4 kg and contains approximately 86 billion neurons. It uses about 20% of the body\'s total energy.' },
            { title: 'Major Regions', text: 'Cerebrum (thinking), Cerebellum (balance), Brainstem (vital functions), Limbic System (emotions & memory).' }
        ]
    },
    {
        id: 'lungs',
        name: 'Lungs',
        category: 'Pulmonology',
        emoji: '🫁',
        glb: 'https://modelviewer.dev/shared-assets/models/RocketShip.glb',
        usdz: null,
        cameraOrbit: '0deg 75deg 3m',
        description: 'Interactive 3D model of human lungs with bronchial tree and alveoli annotations.',
        tags: ['Anatomy', 'Pulmonology', 'Respiratory'],
        hotspots: [
            { position: '0 0.05 0.03', normal: '0 1 0', label: 'Trachea', info: 'The trachea (windpipe) is about 10-12 cm long. It connects the larynx to the bronchi and carries air to and from the lungs.' },
            { position: '0.04 0 0.02', normal: '1 0 0', label: 'Right Lung', info: 'The right lung has 3 lobes and is slightly larger than the left lung. It handles about 55% of gas exchange.' }
        ],
        videos: [
            { title: 'How Breathing Works', duration: '4:00', emoji: '💨' },
            { title: 'Lung Anatomy Deep Dive', duration: '8:20', emoji: '🫁' }
        ],
        infoSections: [
            { title: 'Overview', text: 'The lungs contain about 300 million alveoli with a combined surface area of ~70 square meters — roughly the size of a tennis court.' },
            { title: 'Function', text: 'The primary function is gas exchange: oxygen enters the blood, carbon dioxide is removed. An adult breathes about 12-20 times per minute at rest.' }
        ]
    }
];

// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
let currentModel = 0;
let currentSection = 'ar';
const viewer = document.getElementById('viewer');

// ══════════════════════════════════════════════
// START SCREEN
// ══════════════════════════════════════════════
function launchApp(section) {
    document.getElementById('start-screen').classList.remove('active');
    document.getElementById('app-screen').classList.add('active');
    buildModelStrip();
    loadModel(0);
    switchSection(section);
}

function goHome() {
    document.getElementById('app-screen').classList.remove('active');
    document.getElementById('start-screen').classList.add('active');
}

// ══════════════════════════════════════════════
// MODEL STRIP (Dynamic List)
// ══════════════════════════════════════════════
function buildModelStrip() {
    const strip = document.getElementById('model-strip');
    strip.innerHTML = MODELS.map((m, i) => `
        <div class="model-chip ${i === 0 ? 'active' : ''}" onclick="loadModel(${i})" id="chip-${i}">
            <div class="thumb">${m.emoji}</div>
            <div>
                <div class="chip-name">${m.name}</div>
                <div class="chip-cat">${m.category}</div>
            </div>
        </div>
    `).join('');
}

// ══════════════════════════════════════════════
// LOAD MODEL (with hotspots + info)
// ══════════════════════════════════════════════
function loadModel(index) {
    currentModel = index;
    const m = MODELS[index];

    // Update viewer
    viewer.src = m.glb;
    if (m.usdz) viewer.setAttribute('ios-src', m.usdz);
    else viewer.removeAttribute('ios-src');
    viewer.cameraOrbit = m.cameraOrbit;

    // Update chip active state
    document.querySelectorAll('.model-chip').forEach((c, i) => 
        c.classList.toggle('active', i === index));

    // Load hotspots
    loadHotspots(m);

    // Load info panels
    loadARInfo(m);
    loadVideoSection(m);
    loadInfoSection(m);

    // Close any open popup
    closePopup();
}

// ══════════════════════════════════════════════
// HOTSPOTS (Click Points on Model)
// ══════════════════════════════════════════════
function loadHotspots(m) {
    // Remove old hotspots
    viewer.querySelectorAll('[slot^="hotspot"]').forEach(el => el.remove());

    // Add new hotspots
    m.hotspots.forEach((h, i) => {
        const btn = document.createElement('button');
        btn.className = 'hotspot';
        btn.slot = `hotspot-${i}`;
        btn.dataset.position = h.position;
        btn.dataset.normal = h.normal;
        btn.dataset.label = h.label;
        btn.dataset.info = h.info;
        btn.dataset.visibilityAttribute = 'visible';
        btn.innerHTML = '<span class="dot"></span>';
        btn.addEventListener('click', () => showHotspotInfo(h, btn));
        viewer.appendChild(btn);
    });
}

function showHotspotInfo(h, btn) {
    // Deactivate all hotspots
    viewer.querySelectorAll('.hotspot').forEach(hs => hs.classList.remove('active'));
    btn.classList.add('active');

    // Show popup
    const popup = document.getElementById('info-popup');
    document.getElementById('popup-title').textContent = h.label;
    document.getElementById('popup-text').textContent = h.info;
    popup.classList.add('show');
}

function closePopup() {
    document.getElementById('info-popup').classList.remove('show');
    viewer.querySelectorAll('.hotspot').forEach(hs => hs.classList.remove('active'));
}

// ══════════════════════════════════════════════
// AR INFO PANEL (below viewer)
// ══════════════════════════════════════════════
function loadARInfo(m) {
    document.getElementById('ar-info-panel').innerHTML = `
        <div class="info-card">
            <h3>${m.name}</h3>
            <p>${m.description}</p>
            <div class="tag-row">
                ${m.tags.map(t => `<span class="info-tag">${t}</span>`).join('')}
            </div>
        </div>
    `;
}

// ══════════════════════════════════════════════
// VIDEO SECTION
// ══════════════════════════════════════════════
function loadVideoSection(m) {
    document.getElementById('video-section-content').innerHTML = `
        <div class="video-placeholder">
            <div class="play-icon">▶</div>
            <p>${m.name} — Tutorial Videos</p>
        </div>
        <div class="video-list">
            ${m.videos.map(v => `
                <div class="video-item" onclick="alert('Video player: ${v.title}\\n\\nYahan apna video URL daal do.\\nExample: YouTube embed ya local video file.')">
                    <div class="vi-thumb">${v.emoji}</div>
                    <div class="vi-info">
                        <div class="vi-title">${v.title}</div>
                        <div class="vi-dur">${v.duration}</div>
                    </div>
                </div>
            `).join('')}
        </div>
    `;
}

// ══════════════════════════════════════════════
// INFO SECTION
// ══════════════════════════════════════════════
function loadInfoSection(m) {
    document.getElementById('info-section-content').innerHTML = `
        <div class="info-card">
            <h3>${m.name}</h3>
            <p>${m.description}</p>
            <div class="tag-row">
                ${m.tags.map(t => `<span class="info-tag">${t}</span>`).join('')}
            </div>
        </div>
        ${m.infoSections.map(s => `
            <div class="info-card">
                <h3>${s.title}</h3>
                <p>${s.text}</p>
            </div>
        `).join('')}
        <div class="info-card">
            <h3>Hotspot Points</h3>
            ${m.hotspots.map(h => `
                <p style="margin-bottom:8px"><strong style="color:var(--ac)">${h.label}:</strong> ${h.info}</p>
            `).join('')}
        </div>
    `;
}

// ══════════════════════════════════════════════
// SECTION SWITCHING (AR / Video / Info)
// ══════════════════════════════════════════════
function switchSection(section) {
    currentSection = section;
    
    // Update sections
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(`section-${section}`).classList.add('active');

    // Update nav
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById(`nav-${section}`).classList.add('active');

    // Update top bar
    const titles = { ar: 'AR View', video: 'Video', info: 'Information' };
    document.getElementById('top-title').textContent = titles[section];
    
    const pill = document.getElementById('mode-pill');
    pill.className = `mode-pill ${section}`;
    pill.textContent = section.toUpperCase();
}

// ══════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════
viewer.addEventListener('click', (e) => {
    if (!e.target.classList.contains('hotspot') && 
        !e.target.classList.contains('dot') &&
        !e.target.closest('.info-popup')) {
        closePopup();
    }
});
</script>
