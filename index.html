<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>My AR Experience</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a1a; color: #fff;
      min-height: 100vh;
    }

    /* Header */
    .header {
      padding: 20px 16px 12px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .header h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .header p { font-size: 13px; color: rgba(255,255,255,0.45); }

    /* Search */
    .search-bar {
      padding: 12px 16px;
      position: sticky; top: 0;
      background: #0a0a1a; z-index: 10;
    }
    .search-bar input {
      width: 100%; padding: 12px 16px;
      border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.06); color: #fff;
      font-size: 14px; outline: none;
    }
    .search-bar input::placeholder { color: rgba(255,255,255,0.3); }
    .search-bar input:focus { border-color: rgba(255,255,255,0.25); }

    /* Filter tabs */
    .filters {
      padding: 0 16px 12px;
      display: flex; gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .filters::-webkit-scrollbar { display: none; }
    .filter-btn {
      padding: 6px 16px; border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.12);
      background: transparent; color: rgba(255,255,255,0.6);
      font-size: 12px; white-space: nowrap; cursor: pointer;
    }
    .filter-btn.active {
      background: #fff; color: #000;
      border-color: #fff;
    }

    /* Mode toggle */
    .mode-toggle {
      padding: 0 16px 16px;
      display: flex; gap: 8px;
    }
    .mode-btn {
      flex: 1; padding: 12px;
      border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      color: #fff; font-size: 13px; font-weight: 600;
      cursor: pointer; text-align: center;
      transition: all 0.2s;
    }
    .mode-btn.active {
      background: rgba(0,200,100,0.15);
      border-color: rgba(0,200,100,0.4);
      color: #00cc66;
    }
    .mode-btn span { display: block; font-size: 22px; margin-bottom: 4px; }

    /* Cards grid */
    .grid {
      padding: 0 16px 100px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px; overflow: hidden;
      cursor: pointer; transition: transform 0.2s;
    }
    .card:active { transform: scale(0.97); }
    .card img {
      width: 100%; aspect-ratio: 1;
      object-fit: cover; background: #111;
    }
    .card .info { padding: 10px 12px; }
    .card .info h3 {
      font-size: 13px; font-weight: 600;
      margin-bottom: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card .info span {
      font-size: 11px; color: rgba(255,255,255,0.4);
    }

    /* Empty state */
    .empty {
      grid-column: 1 / -1;
      text-align: center; padding: 40px 20px;
      color: rgba(255,255,255,0.3);
    }

    /* Plane AR card (top special card) */
    .plane-card {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, rgba(0,200,100,0.1), rgba(0,100,200,0.1));
      border: 1px solid rgba(0,200,100,0.2);
      border-radius: 14px; padding: 16px;
      cursor: pointer; transition: transform 0.2s;
      display: none;
    }
    .plane-card.active { display: flex; align-items: center; gap: 14px; }
    .plane-card:active { transform: scale(0.98); }
    .plane-card .icon { font-size: 36px; }
    .plane-card h3 { font-size: 15px; font-weight: 600; color: #00cc66; }
    .plane-card p { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 2px; }

    /* Count */
    .count {
      padding: 4px 16px 12px;
      font-size: 12px; color: rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>My AR Experience</h1>
    <p>Scan images or place models in real world</p>
  </div>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search AR experiences..." oninput="filterCards()">
  </div>

  <div class="filters" id="filters"></div>

  <div class="mode-toggle">
    <div class="mode-btn active" id="modeImage" onclick="setMode('image')">
      <span>📷</span> Image Scan
    </div>
    <div class="mode-btn" id="modePlane" onclick="setMode('plane')">
      <span>📱</span> Tap to Place
    </div>
  </div>

  <div class="count" id="count"></div>

  <div class="grid" id="grid">
    <div class="plane-card" id="planeCard" onclick="launchPlane()">
      <div class="icon">📱</div>
      <div>
        <h3>Tap to Place AR</h3>
        <p>Place any 3D model on floor or table</p>
      </div>
    </div>
  </div>

  <script>
    let catalog = [];
    let currentMode = 'image';
    let currentFilter = 'all';

    // Load catalog from JSON
    async function loadCatalog() {
      try {
        const res = await fetch('ar-catalog.json');
        const data = await res.json();
        catalog = data.experiences || [];
        buildFilters();
        renderCards();
      } catch (err) {
        console.error('Failed to load catalog:', err);
        document.getElementById('grid').innerHTML =
          '<div class="empty">Failed to load AR catalog. Check ar-catalog.json</div>';
      }
    }

    // Build category filter buttons
    function buildFilters() {
      const cats = ['all', ...new Set(catalog.map(e => e.category).filter(Boolean))];
      const container = document.getElementById('filters');
      container.innerHTML = cats.map(cat =>
        `<button class="filter-btn ${cat === 'all' ? 'active' : ''}" onclick="setFilter('${cat}')">${cat}</button>`
      ).join('');
    }

    // Set mode (image scan vs plane)
    function setMode(mode) {
      currentMode = mode;
      document.getElementById('modeImage').classList.toggle('active', mode === 'image');
      document.getElementById('modePlane').classList.toggle('active', mode === 'plane');
      renderCards();
    }

    // Set category filter
    function setFilter(cat) {
      currentFilter = cat;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent === cat);
      });
      filterCards();
    }

    // Filter cards by search + category
    function filterCards() {
      renderCards();
    }

    // Render card grid
    function renderCards() {
      const grid = document.getElementById('grid');
      const search = document.getElementById('searchInput').value.toLowerCase().trim();
      const planeCard = document.getElementById('planeCard');

      // Show plane card only in plane mode
      planeCard.classList.toggle('active', currentMode === 'plane');

      // Filter experiences
      let filtered = catalog;
      if (currentFilter !== 'all') {
        filtered = filtered.filter(e => e.category === currentFilter);
      }
      if (search) {
        filtered = filtered.filter(e =>
          e.name.toLowerCase().includes(search) ||
          (e.description && e.description.toLowerCase().includes(search)) ||
          (e.category && e.category.toLowerCase().includes(search))
        );
      }

      // Update count
      document.getElementById('count').textContent = `${filtered.length} experience${filtered.length !== 1 ? 's' : ''} found`;

      // Remove old cards (keep planeCard)
      grid.querySelectorAll('.card').forEach(c => c.remove());

      if (filtered.length === 0) {
        grid.insertAdjacentHTML('beforeend', '<div class="card empty">No experiences found</div>');
        return;
      }

      // Render cards
      filtered.forEach(exp => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => launchAR(exp);
        card.innerHTML = `
          <img src="${exp.targetPreview || 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1 1%22><rect fill=%22%23222%22 width=%221%22 height=%221%22/><text x=%22.5%22 y=%22.6%22 font-size=%22.3%22 fill=%22%23555%22 text-anchor=%22middle%22>AR</text></svg>'}"
               alt="${exp.name}"
               onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1 1%22><rect fill=%22%23222%22 width=%221%22 height=%221%22/><text x=%22.5%22 y=%22.6%22 font-size=%22.3%22 fill=%22%23555%22 text-anchor=%22middle%22>AR</text></svg>'">
          <div class="info">
            <h3>${exp.name}</h3>
            <span>${exp.category || 'general'}</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Launch Image Scan AR
    function launchAR(exp) {
      if (currentMode === 'plane') {
        // Plane mode — pass model info via URL params
        const params = new URLSearchParams({
          mode: 'plane',
          model: exp.model,
          scale: exp.scale || 0.3,
          rotX: exp.rotationX || 0,
          name: exp.name,
        });
        window.location.href = `ar.html?${params}`;
      } else {
        // Image scan mode
        const params = new URLSearchParams({
          mode: 'image',
          target: exp.targetMind,
          model: exp.model,
          scale: exp.scale || 0.3,
          rotX: exp.rotationX || 0,
          name: exp.name,
        });
        window.location.href = `ar.html?${params}`;
      }
    }

    // Launch Plane AR without specific model
    function launchPlane() {
      // Use first model in catalog or default
      const defaultModel = catalog[0]?.model || 'assets/models/default.glb';
      const params = new URLSearchParams({
        mode: 'plane',
        model: defaultModel,
        scale: 0.3,
        name: 'Plane AR',
      });
      window.location.href = `ar.html?${params}`;
    }

    // Init
    loadCatalog();
  </script>
</body>
</html>
