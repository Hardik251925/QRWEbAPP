<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0a10">
    <!-- FORCE NO CACHE — har baar fresh load hoga -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>AR Medical Viewer</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#0a0a10;--s1:#12121a;--s2:#1a1a26;--s3:#222233;--b:rgba(255,255,255,0.06);--b2:rgba(255,255,255,0.12);--t:#eeeae4;--t2:#9a968e;--t3:#5a5750;--ac:#00e6a0;--ac2:#6c5ce7;--ac3:#ff6b6b;--ac4:#f0a030;--r:12px}
        body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--t);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
        .screen{display:none;min-height:100dvh}.screen.active{display:flex;flex-direction:column}
        #start-screen{align-items:center;justify-content:center;padding:24px;text-align:center;background:radial-gradient(ellipse at 50% 80%,#141428 0%,var(--bg) 70%)}
        .start-logo{width:80px;height:80px;border-radius:24px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;margin:0 auto 20px;box-shadow:0 8px 40px rgba(0,230,160,0.2);font-size:36px;font-weight:700;color:#fff}
        .start-title{font-size:28px;font-weight:700;letter-spacing:-0.5px;margin-bottom:6px}
        .start-sub{font-size:14px;color:var(--t2);margin-bottom:32px;line-height:1.6;max-width:340px}
        .start-buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:400px}
        .start-btn{padding:18px 12px;border-radius:16px;border:1px solid var(--b2);background:var(--s1);cursor:pointer;text-align:center;transition:transform .15s,border-color .2s,background .2s}
        .start-btn:active{transform:scale(0.96)}.start-btn:hover{border-color:var(--ac);background:var(--s2)}
        .start-btn .icon{font-size:28px;margin-bottom:8px;display:block}.start-btn .label{font-size:13px;font-weight:600;color:var(--t)}.start-btn .desc{font-size:11px;color:var(--t3);margin-top:3px}
        .start-btn.primary{border-color:var(--ac);background:rgba(0,230,160,0.06)}.start-btn.primary .label{color:var(--ac)}
        #app-screen{padding-bottom:70px}
        .top-bar{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--b);background:rgba(10,10,16,0.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);position:sticky;top:0;z-index:50}
        .back-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--b2);background:var(--s1);display:grid;place-items:center;cursor:pointer;color:var(--t2);font-size:16px}
        .top-title{font-size:15px;font-weight:600;flex:1}
        .mode-pill{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
        .mode-pill.ar{background:rgba(0,230,160,0.12);color:var(--ac)}.mode-pill.video{background:rgba(108,92,231,0.15);color:var(--ac2)}.mode-pill.info{background:rgba(255,107,107,0.12);color:var(--ac3)}.mode-pill.image{background:rgba(240,160,48,0.12);color:var(--ac4)}
        .model-strip{display:flex;gap:10px;padding:14px 16px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--b);-webkit-overflow-scrolling:touch}.model-strip::-webkit-scrollbar{display:none}
        .model-chip{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:12px;border:1px solid var(--b);background:var(--s1);cursor:pointer;transition:border-color .2s,background .2s}
        .model-chip.active{border-color:var(--ac);background:rgba(0,230,160,0.06)}.model-chip .thumb{width:36px;height:36px;border-radius:8px;background:var(--s2);display:grid;place-items:center;font-size:18px}.model-chip .chip-name{font-size:12px;font-weight:600}.model-chip .chip-cat{font-size:10px;color:var(--t3)}
        .viewer-wrap{position:relative;background:var(--s1);border-bottom:1px solid var(--b)}
        model-viewer{width:100%;height:52dvh;min-height:340px;--poster-color:transparent;--progress-bar-color:var(--ac);--progress-bar-height:3px}
        .ar-btn-slot{display:flex;align-items:center;justify-content:center;gap:8px;position:absolute;bottom:16px;left:16px;right:16px;padding:14px;background:linear-gradient(135deg,var(--ac),#00c488);border:none;border-radius:14px;color:#fff;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 4px 24px rgba(0,230,160,0.3);z-index:10;-webkit-appearance:none}.ar-btn-slot:active{transform:scale(0.97)}
        .hotspot{width:28px;height:28px;border-radius:50%;border:2px solid var(--ac);background:rgba(0,230,160,0.2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s,background .2s;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);position:relative;-webkit-appearance:none;padding:0}
        .hotspot:hover,.hotspot.active{transform:scale(1.3);background:rgba(0,230,160,0.5)}
        .hotspot::after{content:attr(data-label);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;padding:4px 10px;border-radius:8px;background:var(--s2);border:1px solid var(--b2);font-size:11px;font-weight:500;color:var(--t);opacity:0;pointer-events:none;transition:opacity .2s}
        .hotspot.active::after{opacity:1}.hotspot .dot{width:8px;height:8px;border-radius:50%;background:var(--ac);animation:pd 2s ease-in-out infinite}@keyframes pd{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}
        .info-popup{position:absolute;bottom:80px;left:16px;right:16px;background:rgba(26,26,38,0.97);border:1px solid var(--b2);border-radius:16px;padding:16px;z-index:20;display:none;animation:su .25s ease;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}.info-popup.show{display:block}@keyframes su{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .info-popup .popup-title{font-size:14px;font-weight:600;margin-bottom:4px;color:var(--ac)}.info-popup .popup-text{font-size:13px;color:var(--t2);line-height:1.6}
        .info-popup .close-popup{position:absolute;top:10px;right:12px;width:24px;height:24px;border-radius:50%;background:var(--s3);border:none;color:var(--t2);cursor:pointer;display:grid;place-items:center;font-size:14px;-webkit-appearance:none}
        .info-panel{padding:16px}.info-card{background:var(--s1);border:1px solid var(--b);border-radius:var(--r);padding:16px;margin-bottom:10px}.info-card h3{font-size:15px;font-weight:600;margin-bottom:6px}.info-card p{font-size:13px;color:var(--t2);line-height:1.7}.info-card .tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.info-tag{padding:4px 10px;border-radius:8px;font-size:11px;font-weight:500;background:var(--s2);border:1px solid var(--b);color:var(--t2)}
        .video-section{padding:16px}.video-placeholder{width:100%;aspect-ratio:16/9;border-radius:var(--r);background:var(--s1);border:1px solid var(--b);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;margin-bottom:12px}.video-placeholder .play-icon{width:56px;height:56px;border-radius:50%;background:rgba(108,92,231,0.2);border:2px solid var(--ac2);display:grid;place-items:center;font-size:22px;color:var(--ac2)}.video-placeholder p{font-size:13px;color:var(--t3)}
        .video-list{display:flex;flex-direction:column;gap:8px}.video-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--s1);border:1px solid var(--b);border-radius:var(--r);cursor:pointer}.video-item:active{background:var(--s2)}.video-item .vi-thumb{width:44px;height:44px;border-radius:8px;background:var(--s2);display:grid;place-items:center;font-size:20px;flex-shrink:0}.video-item .vi-info{flex:1}.video-item .vi-title{font-size:13px;font-weight:500}.video-item .vi-dur{font-size:11px;color:var(--t3)}
        .image-section{padding:16px}.image-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
        .image-card{border-radius:var(--r);overflow:hidden;border:1px solid var(--b);background:var(--s1);cursor:pointer;transition:border-color .2s,transform .15s}.image-card:active{transform:scale(0.97)}.image-card:hover{border-color:var(--ac4)}
        .image-card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--s2)}.image-card .img-label{padding:8px 10px;font-size:12px;font-weight:500;color:var(--t2)}
        .lightbox{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.95);align-items:center;justify-content:center;flex-direction:column;padding:20px;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}.lightbox.show{display:flex}
        .lightbox img{max-width:100%;max-height:70vh;border-radius:12px;object-fit:contain}.lightbox .lb-caption{color:var(--t2);font-size:14px;margin-top:12px;text-align:center}
        .lightbox .lb-close{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:20px;cursor:pointer;display:grid;place-items:center;-webkit-appearance:none}
        .lightbox .lb-nav{display:flex;gap:12px;margin-top:16px}.lightbox .lb-nav button{padding:8px 20px;border-radius:10px;border:1px solid var(--b2);background:var(--s2);color:var(--t);font-size:13px;cursor:pointer;-webkit-appearance:none}.lightbox .lb-nav button:active{opacity:.7}
        .bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(10,10,16,0.95);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--b);z-index:100;padding:6px 0 env(safe-area-inset-bottom,6px)}
        .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;cursor:pointer;transition:color .2s;color:var(--t3);-webkit-tap-highlight-color:transparent}.nav-item.active{color:var(--ac)}.nav-item .nav-icon{font-size:20px}.nav-item .nav-label{font-size:10px;font-weight:600;letter-spacing:.3px}
        .section{display:none}.section.active{display:block}
        .loading-overlay{position:fixed;inset:0;background:var(--bg);z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
        .loading-overlay.hidden{display:none}
        .spinner{width:40px;height:40px;border:3px solid var(--s3);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
        .loading-overlay .lt{font-size:14px;color:var(--t2)}.loading-overlay .ls{font-size:12px;color:var(--t3);max-width:300px;text-align:center;line-height:1.5}
        .loading-overlay .le{color:var(--ac3);font-size:13px;max-width:320px;text-align:center;line-height:1.6;margin-top:8px;white-space:pre-line}
        .loading-overlay .rb{margin-top:12px;padding:10px 24px;border-radius:10px;border:1px solid var(--b2);background:var(--s2);color:var(--t);font-size:13px;cursor:pointer}
    </style>
</head>
<body>
<div class="loading-overlay" id="lo"><div class="spinner"></div><div class="lt" id="lt">Loading...</div><div class="ls" id="ls"></div><div class="le" id="le" style="display:none"></div><button class="rb" id="rb" style="display:none" onclick="initApp()">Retry</button></div>
<div class="screen" id="start-screen">
    <div class="start-logo">AR</div><h1 class="start-title">AR Medical Viewer</h1>
    <p class="start-sub">3D models explore karo AR mein. QR scan se data auto-load hoga.</p>
    <div class="start-buttons">
        <div class="start-btn primary" onclick="launchApp('ar')"><span class="icon">📱</span><span class="label">AR View</span><span class="desc">Place in real world</span></div>
        <div class="start-btn" onclick="launchApp('video')"><span class="icon">🎬</span><span class="label">Video</span><span class="desc">Watch tutorials</span></div>
        <div class="start-btn" onclick="launchApp('info')"><span class="icon">📋</span><span class="label">Information</span><span class="desc">Read details</span></div>
        <div class="start-btn" onclick="launchApp('image')"><span class="icon">🖼️</span><span class="label">Images</span><span class="desc">View gallery</span></div>
    </div>
</div>
<div class="screen" id="app-screen">
    <div class="top-bar"><div class="back-btn" onclick="goHome()">←</div><span class="top-title" id="top-title">AR View</span><span class="mode-pill ar" id="mode-pill">AR</span></div>
    <div class="model-strip" id="model-strip"></div>
    <div class="section active" id="section-ar"><div class="viewer-wrap">
        <model-viewer id="viewer" alt="3D Model" ar ar-modes="scene-viewer quick-look" ar-scale="auto" ar-placement="floor" camera-controls touch-action="pan-y" auto-rotate rotation-per-second="16deg" shadow-intensity="1.5" shadow-softness="0.8" exposure="1.1" environment-image="neutral" interaction-prompt="auto" camera-orbit="30deg 75deg 2.5m" interpolation-decay="100">
            <button slot="ar-button" class="ar-btn-slot"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.18L19.18 7.5 12 10.82 4.82 7.5 12 4.18zM4 9.32l7 3.5V19.3l-7-3.5V9.32zm9 10v-6.48l7-3.5v6.48l-7 3.5z"/></svg> View in AR</button>
        </model-viewer>
        <div class="info-popup" id="info-popup"><button class="close-popup" onclick="closePopup()">✕</button><div class="popup-title" id="popup-title"></div><div class="popup-text" id="popup-text"></div></div>
    </div><div class="info-panel" id="ar-info-panel"></div></div>
    <div class="section" id="section-video"><div class="video-section" id="video-section-content"></div></div>
    <div class="section" id="section-info"><div class="info-panel" id="info-section-content"></div></div>
    <div class="section" id="section-image"><div class="image-section" id="image-section-content"></div></div>
    <div class="bottom-nav">
        <div class="nav-item active" id="nav-ar" onclick="switchSection('ar')"><span class="nav-icon">📱</span><span class="nav-label">AR</span></div>
        <div class="nav-item" id="nav-video" onclick="switchSection('video')"><span class="nav-icon">🎬</span><span class="nav-label">Video</span></div>
        <div class="nav-item" id="nav-info" onclick="switchSection('info')"><span class="nav-icon">📋</span><span class="nav-label">Info</span></div>
        <div class="nav-item" id="nav-image" onclick="switchSection('image')"><span class="nav-icon">🖼️</span><span class="nav-label">Images</span></div>
    </div>
</div>
<div class="lightbox" id="lightbox"><button class="lb-close" onclick="closeLightbox()">✕</button><img id="lb-img" src="" alt=""><div class="lb-caption" id="lb-caption"></div><div class="lb-nav"><button onclick="lbPrev()">← Prev</button><button onclick="lbNext()">Next →</button></div></div>
<script>
// ══════════════════════════════════════════════════════
// CONFIGURE:
//
// API_URL   → Server API endpoint (GET)
// LOCAL_JSON → Fallback local file
//
// QR CODE FORMAT:
//   https://hardik251925.github.io/QRWEbAPP?heart
//   https://hardik251925.github.io/QRWEbAPP?brain
//   https://hardik251925.github.io/QRWEbAPP?lungs
//
// URL ke baad ? ke baad jo bhi likha hoga woh model ID/name hai
// Ye API/JSON data mein "id" ya "name" se match hoga
// Match hoga toh seedha woh model dikhega — model list nahi
// ══════════════════════════════════════════════════════
const API_URL = '';   // ← APNA API URL YAHAN DALO
const LOCAL_JSON = 'assets/data/models.json';

let MODELS=[],currentModel=0,currentSection='ar',lbImages=[],lbIndex=0,dataSource='';
let qrModelKey = '';  // QR se aaya model name
const viewer=document.getElementById('viewer');

// ── Extract model name from QR URL ──
// URL: ?heart  or  ?model=heart  or  ?id=heart
function getQRModelName(){
    const search = location.search;
    if(!search || search === '?') return '';

    // Format 1: ?heart (just the name after ?)
    // Format 2: ?model=heart or ?id=heart or ?name=heart
    const params = new URLSearchParams(search);
    
    // Check named params first
    const named = params.get('model') || params.get('id') || params.get('name');
    if(named) return named.trim().toLowerCase();
    
    // If no named param, the whole query string IS the name
    // ?heart → search = "?heart" → remove "?" → "heart"
    const raw = search.substring(1).split('&')[0].split('=')[0];
    return raw.trim().toLowerCase();
}

async function initApp(){
    sL('Loading data...','');hE();
    
    // Get model name from QR URL
    qrModelKey = getQRModelName();
    if(qrModelKey){
        console.log('[AR] QR model key:', qrModelKey);
        sL('Loading data...', 'Model: ' + qrModelKey);
    }

    // ── STEP 1: Try API ──
    if(API_URL && API_URL.length > 0){
        sL('Fetching from server...', API_URL);
        try{
            const d = await ft(API_URL, 10000);
            MODELS = pm(d);
            dataSource = 'API: ' + API_URL;
            console.log('[AR] API loaded:', MODELS.length, 'models');
            onReady();
            return;
        }catch(e){
            console.warn('[AR] API failed:', e.message);
            sL('Server not available, loading offline...', e.message);
        }
    }

    // ── STEP 2: Local JSON fallback ──
    sL('Loading offline data...', LOCAL_JSON);
    try{
        const d = await ft(LOCAL_JSON, 5000);
        MODELS = pm(d);
        dataSource = 'Offline: ' + LOCAL_JSON;
        console.log('[AR] Local loaded:', MODELS.length, 'models');
        onReady();
        return;
    }catch(e){
        console.error('[AR] Local fail:', e.message);
    }

    sE('Data load nahi hua!\n\n1. assets/data/models.json upload karo\n2. Ya API_URL set karo');
}

// ── Find model by id from QR ──
// URL: ?heart → qrModelKey = "heart" → match with JSON "id": "heart"
function findQRModelIndex(){
    if(!qrModelKey) return -1;
    return MODELS.findIndex(m => m.id.toLowerCase() === qrModelKey);
}

function onReady(){
    if(!MODELS.length){sE('JSON mein koi valid model nahi.\n"id","name","glb" zaroori hai.');return}
    hL();
    
    // ── QR MATCH: seedha model dikhao, start screen skip karo ──
    const matchIdx = findQRModelIndex();
    if(matchIdx >= 0){
        console.log('[AR] QR matched:', MODELS[matchIdx].name, '(index:', matchIdx, ')');
        document.getElementById('start-screen').classList.remove('active');
        document.getElementById('app-screen').classList.add('active');
        buildModelStrip();
        loadModel(matchIdx);
        switchSection('ar');
        return;
    }
    
    // ── No QR match: show error or start screen ──
    if(qrModelKey){
        console.warn('[AR] QR key "' + qrModelKey + '" not found in models');
        sL('Model Not Found', '');
        sE('Model "' + qrModelKey + '" not found in data.\n\nAvailable models: ' + MODELS.map(m=>m.id).join(', ') + '\n\nCheck if models.json has this id.');
        return;
    }
    document.getElementById('start-screen').classList.add('active');
}
async function ft(u,t){const c=new AbortController;const tm=setTimeout(()=>c.abort(),t);try{
    // Cache bust: add timestamp to URL so browser never uses cached response
    const bustUrl = u + (u.includes('?') ? '&' : '?') + '_t=' + Date.now();
    const r=await fetch(bustUrl,{signal:c.signal,cache:'no-store'});clearTimeout(tm);if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}catch(e){clearTimeout(tm);if(e.name==='AbortError')throw new Error('Timeout '+t+'ms');throw e}}
function pm(d){let m=Array.isArray(d)?d:(d&&Array.isArray(d.models))?d.models:(d&&d.id)?[d]:[];return m.filter(x=>{if(!x.id||!x.name||!x.glb){console.warn('[AR] Invalid model:',x);return false}x.category=x.category||'';x.emoji=x.emoji||'🔬';x.usdz=x.usdz||null;x.cameraOrbit=x.cameraOrbit||'30deg 75deg 2.5m';x.description=x.description||'';x.tags=x.tags||[];x.hotspots=x.hotspots||[];x.videos=x.videos||[];x.infoSections=x.infoSections||[];x.images=x.images||[];return true})}
function onReady(){if(!MODELS.length){sE('JSON mein koi valid model nahi.\nHar model mein "id","name","glb" zaroori hai.');return}hL();document.getElementById('start-screen').classList.add('active')}
function sL(a,b){const o=document.getElementById('lo');o.classList.remove('hidden');document.getElementById('lt').textContent=a;document.getElementById('ls').textContent=b||''}
function hL(){document.getElementById('lo').classList.add('hidden')}
function sE(m){document.getElementById('lt').textContent='Error';document.getElementById('ls').textContent='';const e=document.getElementById('le');e.style.display='block';e.textContent=m;document.getElementById('rb').style.display='block'}
function hE(){document.getElementById('le').style.display='none';document.getElementById('rb').style.display='none'}

function launchApp(s){document.getElementById('start-screen').classList.remove('active');document.getElementById('app-screen').classList.add('active');buildModelStrip();loadModel(0);switchSection(s)}
function goHome(){document.getElementById('app-screen').classList.remove('active');document.getElementById('start-screen').classList.add('active')}
function buildModelStrip(){document.getElementById('model-strip').innerHTML=MODELS.map((m,i)=>`<div class="model-chip ${i===0?'active':''}" onclick="loadModel(${i})"><div class="thumb">${m.emoji}</div><div><div class="chip-name">${m.name}</div><div class="chip-cat">${m.category}</div></div></div>`).join('')}
function loadModel(i){currentModel=i;const m=MODELS[i];viewer.src=m.glb;if(m.usdz)viewer.setAttribute('ios-src',m.usdz);else viewer.removeAttribute('ios-src');viewer.cameraOrbit=m.cameraOrbit;document.querySelectorAll('.model-chip').forEach((c,j)=>c.classList.toggle('active',j===i));loadHotspots(m);loadARInfo(m);loadVideoSection(m);loadInfoSection(m);loadImageSection(m);closePopup()}
function loadHotspots(m){viewer.querySelectorAll('[slot^="hotspot"]').forEach(el=>el.remove());(m.hotspots||[]).forEach((h,i)=>{const b=document.createElement('button');b.className='hotspot';b.slot='hotspot-'+i;b.dataset.position=h.position;b.dataset.normal=h.normal;b.dataset.label=h.label;b.dataset.visibilityAttribute='visible';b.innerHTML='<span class="dot"></span>';b.addEventListener('click',e=>{e.stopPropagation();showHotspotInfo(h,b)});viewer.appendChild(b)})}
function showHotspotInfo(h,b){viewer.querySelectorAll('.hotspot').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('popup-title').textContent=h.label;document.getElementById('popup-text').textContent=h.info;document.getElementById('info-popup').classList.add('show')}
function closePopup(){document.getElementById('info-popup').classList.remove('show');viewer.querySelectorAll('.hotspot').forEach(x=>x.classList.remove('active'))}
function loadARInfo(m){document.getElementById('ar-info-panel').innerHTML=`<div class="info-card"><h3>${m.name}</h3><p>${m.description}</p>${m.tags.length?`<div class="tag-row">${m.tags.map(t=>`<span class="info-tag">${t}</span>`).join('')}</div>`:''}</div><div class="info-card" style="font-size:11px;color:var(--t3)">Source: ${dataSource}</div>`}
function loadVideoSection(m){const v=m.videos||[];document.getElementById('video-section-content').innerHTML=v.length?`<div class="video-placeholder"><div class="play-icon">▶</div><p>${m.name} — Videos</p></div><div class="video-list">${v.map(x=>`<div class="video-item" onclick="if('${x.url||''}')window.open('${x.url||''}','_blank');else alert('Video URL not set')"><div class="vi-thumb">${x.emoji||'🎬'}</div><div class="vi-info"><div class="vi-title">${x.title}</div><div class="vi-dur">${x.duration||''}</div></div></div>`).join('')}</div>`:`<div class="info-card"><h3>No Videos</h3><p>Videos available nahi hain.</p></div>`}
function loadInfoSection(m){document.getElementById('info-section-content').innerHTML=`<div class="info-card"><h3>${m.name}</h3><p>${m.description}</p>${m.tags.length?`<div class="tag-row">${m.tags.map(t=>`<span class="info-tag">${t}</span>`).join('')}</div>`:''}</div>${(m.infoSections||[]).map(s=>`<div class="info-card"><h3>${s.title}</h3><p>${s.text}</p></div>`).join('')}${m.hotspots.length?`<div class="info-card"><h3>Hotspot Points</h3>${m.hotspots.map(h=>`<p style="margin-bottom:8px"><strong style="color:var(--ac)">${h.label}:</strong> ${h.info}</p>`).join('')}</div>`:''}`}
function loadImageSection(m){const imgs=m.images||[];document.getElementById('image-section-content').innerHTML=imgs.length?`<div style="margin-bottom:12px"><p style="font-size:15px;font-weight:600;margin-bottom:4px">${m.name} — Gallery</p><p style="font-size:12px;color:var(--t3)">${imgs.length} images</p></div><div class="image-grid">${imgs.map((img,i)=>`<div class="image-card" onclick="openLightbox(${currentModel},${i})"><img src="${img.src}" alt="${img.label||''}" onerror="this.style.background='var(--s3)';this.style.minHeight='120px'"><div class="img-label">${img.label||''}</div></div>`).join('')}</div>`:`<div class="info-card"><h3>No Images</h3><p>Images available nahi hain.</p></div>`}
function openLightbox(mi,ii){lbImages=MODELS[mi].images||[];lbIndex=ii;renderLb();document.getElementById('lightbox').classList.add('show')}
function closeLightbox(){document.getElementById('lightbox').classList.remove('show')}
function renderLb(){if(!lbImages[lbIndex])return;document.getElementById('lb-img').src=lbImages[lbIndex].src;document.getElementById('lb-caption').textContent=lbImages[lbIndex].label||''}
function lbNext(){lbIndex=(lbIndex+1)%lbImages.length;renderLb()}
function lbPrev(){lbIndex=(lbIndex-1+lbImages.length)%lbImages.length;renderLb()}
function switchSection(s){currentSection=s;document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));document.getElementById('section-'+s).classList.add('active');document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));document.getElementById('nav-'+s).classList.add('active');const t={ar:'AR View',video:'Video',info:'Information',image:'Images'};document.getElementById('top-title').textContent=t[s];const p=document.getElementById('mode-pill');p.className='mode-pill '+s;p.textContent=s.toUpperCase()}
viewer.addEventListener('click',e=>{if(!e.target.classList.contains('hotspot')&&!e.target.classList.contains('dot')&&!e.target.closest('.info-popup'))closePopup()});

// ══════════════════════════════════════════════
// FORCE FRESH LOAD ON EVERY PAGE VISIT
// ══════════════════════════════════════════════
// Problem: Phone pe QR scan karte ho toh browser cache se 
// purana page dikhata hai instead of fresh load.
//
// Solution:
// 1. pageshow event — jab page cache (bfcache) se aaye toh force reload
// 2. sessionStorage — last loaded model id store karo, 
//    agar URL ka id alag hai toh reload
// 3. No-cache headers + cache-bust fetch URLs

// Case 1: Page from bfcache (back/forward navigation)
window.addEventListener('pageshow', function(e) {
    if (e.persisted) {
        // Page came from cache — force full reload
        location.reload();
    }
});

// Case 2: Check if QR model changed since last load
const currentQR = getQRModelName();
const lastQR = sessionStorage.getItem('ar_last_qr') || '';
if (currentQR && lastQR && currentQR !== lastQR) {
    // Different QR scanned — force reload to fetch fresh data
    sessionStorage.setItem('ar_last_qr', currentQR);
    location.reload();
} else if (currentQR) {
    sessionStorage.setItem('ar_last_qr', currentQR);
}

// Case 3: When tab becomes visible again, check if URL changed
document.addEventListener('visibilitychange', function() {
    if (!document.hidden) {
        const nowQR = getQRModelName();
        const storedQR = sessionStorage.getItem('ar_last_qr') || '';
        if (nowQR && storedQR && nowQR !== storedQR) {
            sessionStorage.setItem('ar_last_qr', nowQR);
            location.reload();
        }
    }
});

initApp();
</script>
